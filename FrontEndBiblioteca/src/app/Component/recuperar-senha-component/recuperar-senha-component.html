<div class="recuperar-container">
  <div class="recuperar-card">
    <div class="recuperar-header">
      <h1>Recuperar senha</h1>
      <p *ngIf="!etapaCodigo">Informe seu e-mail para receber o código de recuperação.</p>
      <p *ngIf="etapaCodigo">Informe o código recebido e escolha uma nova senha.</p>
    </div>

    <p class="mensagem erro" *ngIf="erro" role="alert" aria-live="assertive">
      {{ erro }}
    </p>
    <p class="mensagem sucesso" *ngIf="sucesso" role="status" aria-live="polite">
      {{ sucesso }}
    </p>

    <form *ngIf="!etapaCodigo" (ngSubmit)="enviarCodigo()" #emailForm="ngForm">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="seuemail@empresa.com"
          autocomplete="email"
          required
        />
      </div>

      <button
        type="submit"
        class="acao"
        [disabled]="emailForm.invalid || carregando"
        [attr.aria-busy]="carregando"
      >
        <span class="spinner" *ngIf="carregando" aria-hidden="true"></span>
        {{ carregando ? 'Enviando código...' : 'Enviar código' }}
      </button>
    </form>

    <form *ngIf="etapaCodigo" (ngSubmit)="redefinirSenha()" #codigoForm="ngForm">
      <div class="form-group">
        <label for="codigo">Código recebido</label>
        <input
          type="text"
          id="codigo"
          name="codigo"
          [ngModel]="codigo"
          (ngModelChange)="definirCodigo($event)"
          placeholder="Digite o código"
          autocomplete="one-time-code"
          inputmode="numeric"
          pattern="[0-9]{6}"
          maxlength="6"
          required
        />
      </div>

      <div class="form-group">
        <label for="novaSenha">Nova senha</label>
        <input
          type="password"
          id="novaSenha"
          name="novaSenha"
          [(ngModel)]="novaSenha"
          autocomplete="new-password"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirmarSenha">Confirmar nova senha</label>
        <input
          type="password"
          id="confirmarSenha"
          name="confirmarSenha"
          [(ngModel)]="confirmarSenha"
          autocomplete="new-password"
          required
        />
      </div>

      <button
        type="submit"
        class="acao"
        [disabled]="codigoForm.invalid || carregando"
        [attr.aria-busy]="carregando"
      >
        <span class="spinner" *ngIf="carregando" aria-hidden="true"></span>
        {{ carregando ? 'Redefinindo...' : 'Redefinir senha' }}
      </button>
    </form>

    <button type="button" class="voltar" (click)="voltarAoLogin()">
      Voltar ao login
    </button>
  </div>
</div>
